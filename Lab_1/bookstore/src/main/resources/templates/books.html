<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bookstore Catalog</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        form { margin-top: 20px; }
        input { margin-right: 10px; padding: 5px; }
        button { padding: 6px 12px; cursor: pointer; }
    </style>
</head>
<body>

<h1>Каталог книг (UI)</h1>

<h3>Додати нову книгу</h3>
<form th:action="@{/ui/books/add}" th:object="${newBook}" method="post">
    <input type="text" th:field="*{title}" placeholder="Назва" required />
    <input type="text" th:field="*{author}" placeholder="Автор" required />
    <input type="number" step="0.01" th:field="*{price}" placeholder="Ціна" required />
    <button type="submit">Додати книгу</button>
</form>

<h3>Список книг</h3>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Назва</th>
        <th>Автор</th>
        <th>Ціна</th>
        <th>Дія</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">1</td>
        <td th:text="${book.title}">Назва</td>
        <td th:text="${book.author}">Автор</td>
        <td th:text="${book.price}">0.00</td>
        <td>
            <form th:action="@{'/ui/books/delete/' + ${book.id}}" method="post" style="margin:0;">
                <button type="submit" style="color: red;">Видалити</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
